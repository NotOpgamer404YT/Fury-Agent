name: Migration check

on:
  pull_request:
    paths:
      - "src/lib/database/schema.ts"
      - "drizzle/**"

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ensure migrations match schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::drizzle/ migrations are out of date. Run 'npm run db:generate' and commit the result."
            git --no-pager diff --stat drizzle
            exit 1
          fi
          echo "Migrations are up to date."
